<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>OGC Interoperability Demo</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    body { margin: 0; padding: 0; }
    #map { height: 100vh; width: 100vw; }
  </style>
</head>
<body>
  <div id="map"></div>

  <script>
// Initialize map
  const map = L.map('map').setView([39.5, -98.35], 4);

  // const osm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  //   maxZoom: 19,
  //   attribution: '&copy; OpenStreetMap contributors'
  // }).addTo(map);

  const usgsWMS = L.tileLayer.wms('https://basemap.nationalmap.gov/arcgis/services/USGSTopo/MapServer/WMSServer', {
    layers: '0',
    format: 'image/png',
    transparent: true,
    version: '1.1.1',
    opacity: 0.65, 
    attribution: 'USGS The National Map'
  }).addTo(map);

  const localStatesWMS = L.tileLayer.wms('http://localhost:8080/geoserver/wms', {
    layers: 'topp:states',
    format: 'image/png',
    transparent: true,
    version: '1.1.1',
    opacity: 0.7
  }).addTo(map);

  // Configure Layer Control
  // const baseMaps = {
  //   "OpenStreetMap": osm
  // };
  const overlayMaps = {
    "USGS Topo Map": usgsWMS,
    "GeoServer US States": localStatesWMS
  };

  L.control.layers(null,overlayMaps, { collapsed: false }).addTo(map);
  // claude gen :( 
  </script>
</body>
</html>
